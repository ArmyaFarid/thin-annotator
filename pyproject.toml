[project]
name = "thin-annotator"
version = "0.1.0"
description = "Annotation tool for thin structures, based on SAM 2"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
dependencies = [
    "dataclasses-json==0.6.7",
    "flask==3.1.3",
    "flask-cors==6.0.2",
    "flask-sqlalchemy==3.1.1",
    "imagesize==2.0.0",
    "marshmallow==3.26.2",
    "numpy==2.2.6",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.2.0",
    "pycocotools==2.0.11",
    "scikit-image==0.25.2",
    "waitress==3.0.2",
    # Vendored sam2/ dependencies
    "torch==2.11.0",
    "torchvision==0.26.0",
    "hydra-core==1.3.2",
    "iopath==0.1.10",
    "tqdm==4.67.3",
]

[dependency-groups]
build = [
    "pyinstaller==6.20.0",
]

[tool.uv]
package = false
default-groups = ["build"]
python-preference = "only-managed"
# Transitive versions held at the tested conda environment (sam2-fixed-macos27).
constraint-dependencies = [
    "click==8.3.3",
    "filelock==3.29.0",
    "fsspec==2026.3.0",
    "imageio==2.37.3",
    "lazy-loader==0.5",
    "markupsafe==3.0.3",
    "omegaconf==2.3.0",
    "packaging==26.0",
    "portalocker==3.2.0",
    "pyinstaller-hooks-contrib==2026.4",
    "scipy==1.14.1",
    "sqlalchemy==2.0.49",
    "typing-extensions==4.15.0",
    "werkzeug==3.1.8",
]
